services:
  - type: web
    name: listmonk
    env: docker
    plan: free
    autoDeploy: true
    region: oregon
    image: jeamzx/listmonk:jeam-v1
    healthCheckPath: /admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: listmonk-db
          property: connectionString

databases:
  - name: listmonk-db
    databaseName: listmonk
    user: listmonk
    plan: free
    region: oregon
