services:
  - type: web
    name: listmonk
    env: docker
    plan: free
    autoDeploy: true
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: listmonk-db
          property: connectionString
      - key: LISTMONK_ADMIN_USER
        value: admin
      - key: LISTMONK_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: listmonk-db
    databaseName: listmonk
    user: listmonk
    plan: free
    region: oregon
